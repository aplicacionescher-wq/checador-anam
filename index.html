<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Checador Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#28a745">
</head>
<body>
    <div id="app">
        <div id="login-screen">
            <h1 style="text-align: center;">Reloj Checador</h1>
            <div class="card">
                <input type="email" id="email" placeholder="Correo electrónico">
                <input type="password" id="password" placeholder="Contraseña">
                <button id="btn-login" class="btn-login">Ingresar</button>
            </div>
        </div>

        <div id="main-panel" style="display:none;">
            <header>
                <div id="user-info">Cargando...</div>
                <button id="btn-logout" class="btn-small">Cerrar Sesión</button>
            </header>

            <main>
                <section class="card check-section">
                    <h2>Registro de Entrada</h2>
                    <p id="current-time" style="font-size: 1.5rem; font-weight: bold;"></p>
                    <button id="btn-check" class="btn-check">MARCAR ASISTENCIA</button>
                    <div id="status-msg"></div>
                </section>

                <section id="admin-section" class="card" style="display:none;">
                    <h3>Reporte de Incidencias</h3>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Estado</th>
                                    <th>Justificación</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="report-body"></tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
