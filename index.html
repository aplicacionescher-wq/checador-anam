<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Empresarial - Valle Esmeralda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="login-screen" class="view">
            <div class="card">
                <h2>Acceso Corporativo</h2>
                <input type="email" id="email" placeholder="Usuario (Correo)">
                <input type="password" id="password" placeholder="Contraseña">
                <button id="btn-login" class="btn-primary">Entrar al Sistema</button>
            </div>
        </div>

        <div id="main-panel" class="view" style="display:none;">
            <nav id="navbar" style="display:none;">
                <button onclick="switchView('view-checador')">🕒 Checador</button>
                <button id="nav-horarios" onclick="switchView('view-horarios')" style="display:none;">📅 Horarios</button>
                <button id="nav-reportes" onclick="switchView('view-reportes')" style="display:none;">📊 Reportes</button>
                <button onclick="logout()" class="btn-logout">Cerrar</button>
            </nav>

            <header class="user-bar">
                <span id="user-display">Usuario</span>
                <span id="date-display"></span>
            </header>

            <section id="view-checador" class="view-content">
                <div class="card">
                    <h1 id="live-clock">00:00:00</h1>
                    <div class="check-grid">
                        <button id="btn-in" class="btn-check in">REGISTRAR ENTRADA</button>
                        <button id="btn-out" class="btn-check out">REGISTRAR SALIDA</button>
                    </div>
                    <div id="status-msg"></div>
                </div>
            </section>

            <section id="view-horarios" class="view-content" style="display:none;">
                <div class="card">
                    <h3>Gestión de Personal por Área</h3>
                    <select id="select-empleado"><option>Cargando personal...</option></select>
                    <div id="semana-container">
                        </div>
                    <button id="btn-save-week" class="btn-primary">Guardar Rol Semanal</button>
                </div>
            </section>

            <section id="view-reportes" class="view-content" style="display:none;">
                <div class="card">
                    <h3>Auditoría de Asistencias</h3>
                    <div class="table-scroll">
                        <table>
                            <thead>
                                <tr>
                                    <th>Colaborador</th>
                                    <th>Horario</th>
                                    <th>Estatus</th>
                                    <th>Justificación</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="report-table"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
