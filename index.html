<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Valle Esmeralda</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="app">
        <div id="login-screen">
            <div class="card">
                <h1>Acceso al Sistema</h1>
                <input type="email" id="email" placeholder="Correo electrónico">
                <input type="password" id="password" placeholder="Contraseña">
                <button id="btn-login" class="btn-login">ENTRAR</button>
            </div>
        </div>

        <div id="main-panel" style="display:none;">
            <header>
                <div id="user-info">Cargando...</div>
                <button id="btn-logout" class="btn-small">Cerrar Sesión</button>
            </header>

            <section id="view-checador" class="card">
                <p id="current-time" style="font-size: 2.5rem; font-weight: bold; margin: 10px 0;"></p>
                <div class="check-buttons">
                    <button id="btn-check-in" class="btn-check btn-in">ENTRADA</button>
                    <button id="btn-check-out" class="btn-check btn-out">SALIDA</button>
                </div>
                <div id="status-msg"></div>

                <div id="nav-admin" class="nav-extra" style="display:none;">
                    <button onclick="switchView('view-reportes')" class="btn-nav">📊 Panel de Consultas y Justificaciones</button>
                </div>
                <div id="nav-jefe" class="nav-extra" style="display:none;">
                    <button onclick="switchView('view-horarios')" class="btn-nav" style="background:#007bff;">📅 Gestión de Horarios por Área</button>
                </div>
            </section>

            <section id="view-reportes" class="card" style="display:none;">
                <button onclick="switchView('view-checador')" class="btn-small">⬅ Volver</button>
                <h3>Consultas y Justificaciones</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Personal</th>
                                <th>E/S</th>
                                <th>Estado</th>
                                <th>Justificación</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="report-body"></tbody>
                    </table>
                </div>
            </section>

            <section id="view-horarios" class="card" style="display:none;">
                <button onclick="switchView('view-checador')" class="btn-small">⬅ Volver</button>
                <h3>Configuración de Horario Semanal</h3>
                <select id="select-empleado"><option value="">Seleccione al trabajador...</option></select>
                
                <div id="contenedor-semanal" class="grid-horarios">
                    </div>
                <button id="btn-guardar-semana" class="btn-login" style="margin-top:20px;">GUARDAR SEMANA</button>
            </section>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
