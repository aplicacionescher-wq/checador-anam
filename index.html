<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Checador Valle Esmeralda</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#28a745">
</head>
<body>
    <div id="app">
        <div id="login-screen">
            <div class="card">
                <h1>Reloj Checador</h1>
                <input type="email" id="email" placeholder="Correo electrónico">
                <input type="password" id="password" placeholder="Contraseña">
                <button id="btn-login" class="btn-login">INGRESAR</button>
            </div>
        </div>

        <div id="main-panel" style="display:none;">
            <header>
                <div id="user-info">Cargando...</div>
                <button id="btn-logout" class="btn-small">Salir</button>
            </header>

            <main>
                <section class="card check-section">
                    <h2>Asistencia Diaria</h2>
                    <p id="current-time" style="font-size: 2rem; font-weight: bold;"></p>
                    <div style="display: flex; gap: 10px;">
                        <button id="btn-check-in" class="btn-check" style="background:#28a745;">ENTRADA</button>
                        <button id="btn-check-out" class="btn-check" style="background:#dc3545;">SALIDA</button>
                    </div>
                    <div id="status-msg" style="margin-top: 15px;"></div>
                </section>

                <section id="gestion-horarios" class="card" style="display:none; border-top: 4px solid #007bff;">
                    <h3>Asignar Horarios</h3>
                    <select id="select-empleado"><option value="">Seleccionar Personal...</option></select>
                    <select id="select-hora">
                        <option value="7">07:00 AM</option>
                        <option value="9">09:00 AM</option>
                        <option value="10">10:00 AM</option>
                        <option value="11">11:00 AM</option>
                        <option value="12">12:00 PM</option>
                        <option value="15">03:00 PM</option>
                        <option value="23">11:00 PM</option>
                    </select>
                    <button id="btn-asignar-horario" class="btn-login" style="background:#007bff; margin-top:10px;">Actualizar Horario</button>
                </section>

                <section id="admin-section" class="card" style="display:none;">
                    <h3>Reporte de Asistencia</h3>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Entrada</th>
                                    <th>Salida</th>
                                    <th>Estado</th>
                                    <th>Justificación</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="report-body"></tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
